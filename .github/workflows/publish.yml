name: Publish to npm

# Runs when a maintainer publishes a GitHub Release. npm authenticates this
# workflow through trusted publishing (OIDC); there is no npm token secret.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      # A version published by hand (the first release) or by an earlier run
      # is skipped, so re-publishing a release does not fail. Any registry
      # answer other than 200 or 404 fails the job instead of guessing.
      - name: Check whether this version is already on npm
        id: registry
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          url="https://registry.npmjs.org/${name/\//%2f}/${version}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
          case "$status" in
            200) echo "$name@$version is already on npm; skipping publish"
                 echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "Unexpected registry status $status for $url" >&2; exit 1 ;;
          esac

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --silent

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        if: steps.registry.outputs.published == 'false'
        run: npm install -g npm@^11.5.1

      # Versions such as 2.0.0-robotpool.1 are prereleases; publish them as
      # latest so Homebridge UI offers them
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: npm publish --access public --tag latest
